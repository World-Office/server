groups:
  - name: world-office-alerts
    interval: 30s
    rules:
      # Service health alerts
      - alert: ServiceDown
        expr: up{job=~"api-gateway|identity-service|storage-service|conversion-service|coauthoring-service|session-service|docserver|server"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 2 minutes"

      # High error rate alerts
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High error rate for {{ $labels.job }}"
          description: "{{ $labels.job }} has error rate > 10% for 5 minutes"

      # High latency alerts
      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High latency for {{ $labels.job }}"
          description: "{{ $labels.job }} P99 latency > 5s for 5 minutes"

      # Memory usage alerts
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 1000
        for: 10m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "High memory usage for {{ $labels.job }}"
          description: "{{ $labels.job }} memory usage > 1000MB for 10 minutes"

      # Conversion failure alerts
      - alert: ConversionFailures
        expr: rate(conversions_total{status!="success"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          category: functionality
        annotations:
          summary: "High conversion failure rate"
          description: "Conversion failures > 0.5 per minute for 5 minutes"

      # Low conversion success rate
      - alert: LowConversionSuccessRate
        expr: rate(conversions_total{status="success"}[5m]) / rate(conversions_total[5m]) < 0.8
        for: 10m
        labels:
          severity: critical
          category: functionality
        annotations:
          summary: "Low conversion success rate"
          description: "Conversion success rate < 80% for 10 minutes"