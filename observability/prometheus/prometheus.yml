# World-Office Prometheus Configuration
# ======================================
# Scrape targets: all Rust microservices expose /metrics on their service ports.
# Services are expected to use the `metrics` crate with `metrics-exporter-prometheus`.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'

  - job_name: 'identity-service'
    static_configs:
      - targets: ['identity-service:8001']
    metrics_path: '/metrics'

  - job_name: 'storage-service'
    static_configs:
      - targets: ['storage-service:8002']
    metrics_path: '/metrics'

  - job_name: 'conversion-service'
    static_configs:
      - targets: ['conversion-service:8003']
    metrics_path: '/metrics'

  - job_name: 'coauthoring-service'
    static_configs:
      - targets: ['coauthoring-service:8004']
    metrics_path: '/metrics'

  - job_name: 'session-service'
    static_configs:
      - targets: ['session-service:8005']
    metrics_path: '/metrics'

  - job_name: 'docserver'
    static_configs:
      - targets: ['docserver:9091']
    metrics_path: '/metrics'

  - job_name: 'server'
    static_configs:
      - targets: ['server:3000']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
