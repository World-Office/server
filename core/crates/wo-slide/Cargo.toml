[package]
name = "wo-slide"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Presentation slide model, operations, and rendering for the World-Office document editing suite"
repository = "https://codeberg.org/World-Office/server"
homepage = "https://codeberg.org/World-Office/server"
keywords = ["slide", "presentation", "office"]
categories = ["multimedia"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
wo-common = { path = "../wo-common", version = "0.1.0" }
wo-chart = { path = "../wo-chart", version = "0.1.0" }
wo-renderer = { path = "../wo-renderer" }
