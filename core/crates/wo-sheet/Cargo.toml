[package]
name = "wo-sheet"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Spreadsheet model, operations, and serialization for the World-Office document editing suite"
repository = "https://codeberg.org/World-Office/server"
homepage = "https://codeberg.org/World-Office/server"
keywords = ["spreadsheet", "excel", "office"]
categories = ["data-structures"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wo-common = { path = "../wo-common", version = "0.1.0" }
wo-formula = { path = "../wo-formula", version = "0.1.0" }
rustc-hash = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

