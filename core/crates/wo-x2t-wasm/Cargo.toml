[package]
name = "wo-x2t-wasm"
version = "0.1.0"
edition = "2021"
authors = ["World-Office Contributors"]
description = "WASM bindings for World-Office format conversion"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/World-Office/server"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wo-x2t = { path = "../wo-x2t" }
wo-common = { path = "../wo-common" }
console_error_panic_hook = { workspace = true, optional = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

# rand 0.10 (via msoffice-crypto) pulls getrandom 0.4, which needs the
# wasm_js feature enabled on wasm32; the backend cfg lives in
# ../../.cargo/config.toml
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["console_error_panic_hook"]

# CI runners get throttled downloading wasm-pack's binaryen from GitHub
# releases (transient 'failed to download binaryen' failures); the size
# tradeoff is acceptable for CI stability.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
