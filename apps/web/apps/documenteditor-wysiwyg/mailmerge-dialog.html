<!DOCTYPE html>
<html style="display: none;">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../common/common.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-modal-dialog" id="mailmerge-dialog">
    <div class="app-modal-content">
      <div class="app-modal-header">
        <span class="app-modal-title">Mail Merge Recipients</span>
        <div class="app-modal-close" id="btn-mailmerge-close"></div>
      </div>

      <div class="app-modal-body">
        <div class="settings-tabbed-pane">
          <div class="settings-tabbed-panels settings-tabbed-panels-top">
            <div class="settings-tabbed-panel settings-tabbed-panel-checked">
              <span class="settings-tabbed-panel-caption">Recipients</span>
            </div>
            <div class="settings-tabbed-panel">
              <span class="settings-tabbed-panel-caption">Insert Fields</span>
            </div>
            <div class="settings-tabbed-panel">
              <span class="settings-tabbed-panel-caption">Merge</span>
            </div>
          </div>

          <div class="settings-tabbed-content settings-tabbed-content-top">
            <!-- Recipients Tab -->
            <div class="settings-tabbed-content-block" style="display: block; padding: 12px;">
              <div class="form-group">
                <label class="form-label">CSV Recipients File:</label>
                <div style="display: flex; gap: 8px; align-items: center;">
                  <input type="file" id="mailmerge-csv" accept=".csv,text/csv" style="display: none;" />
                  <input type="text" id="mailmerge-csv-path" readonly placeholder="No file selected" style="flex: 1;" />
                  <input type="button" class="form-button" value="Browse..." id="btn-mailmerge-csv" />
                </div>
              </div>
              
              <div class="form-group">
                <label class="form-label">Preview:</label>
                <div class="mailmerge-preview-container" style="max-height: 200px; overflow-y: auto; border: 1px solid #d1d1d1; padding: 8px; background: white;">
                  <table id="mailmerge-preview" style="width: 100%; border-collapse: collapse;">
                    <thead id="mailmerge-preview-header"></thead>
                    <tbody id="mailmerge-preview-body"></tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Insert Fields Tab -->
            <div class="settings-tabbed-content-block" style="display: none; padding: 12px;">
              <div class="form-group">
                <label class="form-label">Available Fields:</label>
                <select id="mailmerge-fields" multiple size="10" style="width: 100%;">
                  <option value="" disabled>Load a CSV file first</option>
                </select>
              </div>
              
              <div class="form-group" style="margin-top: 12px;">
                <label class="form-label">&nbsp;</label>
                <input type="button" class="form-button" value="Insert Selected Field at Cursor" id="btn-mailmerge-insert" />
              </div>
            </div>

            <!-- Merge Tab -->
            <div class="settings-tabbed-content-block" style="display: none; padding: 12px;">
              <div class="form-group">
                <label class="form-label">Merge To:</label>
                <div class="form-radio">
                  <input type="radio" id="mailmerge-to-new" checked name="mailmerge-to" />
                  <label for="mailmerge-to-new">New Document</label>
                </div>
                <div class="form-radio">
                  <input type="radio" id="mailmerge-to-printer" name="mailmerge-to" />
                  <label for="mailmerge-to-printer">Printer</label>
                </div>
              </div>
              
              <div class="form-group" style="margin-top: 12px;">
                <label class="form-label">Range:</label>
                <div class="form-radio">
                  <input type="radio" id="mailmerge-all" checked name="mailmerge-range" />
                  <label for="mailmerge-all">All Records</label>
                </div>
                <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
                  <div class="form-radio">
                    <input type="radio" id="mailmerge-current" name="mailmerge-range" />
                    <label for="mailmerge-current">From</label>
                  </div>
                  <input type="number" id="mailmerge-from" min="1" value="1" style="width: 60px;" />
                  <span>To</span>
                  <input type="number" id="mailmerge-to" min="1" value="1" style="width: 60px;" />
                </div>
              </div>
              
              <div class="form-group" style="margin-top: 12px;">
                <input type="button" class="form-button form-button-primary" value="Merge" id="btn-mailmerge-preview" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="app-modal-footer">
        <span style="flex: 1;"></span>
        <input type="button" class="form-button" value="Cancel" id="btn-mailmerge-cancel" />
        <input type="button" class="form-button form-button-primary" value="OK" id="btn-mailmerge"/>
      </div>
    </div>
  </div>
  
  <script>
    (() => {
      const csvInput = document.getElementById('mailmerge-csv');
      const csvPath = document.getElementById('mailmerge-csv-path');
      const btnCsv = document.getElementById('btn-mailmerge-csv');
      if (btnCsv && csvInput) {
        btnCsv.addEventListener('click', () => csvInput.click());
      }
      if (csvInput) {
        csvInput.addEventListener('change', (e) => {
          if (e.target.files.length > 0) {
            csvPath.value = e.target.files[0].name;
          }
        });
      }
    })();
  </script>
</body>
</html>
