<!DOCTYPE html>
<html style="display: none;">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../common/common.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-modal-dialog" id="macro-dialog">
    <div class="app-modal-content" style="width: 600px;">
      <div class="app-modal-header">
        <span class="app-modal-title">Macros</span>
        <div class="app-modal-close" id="macro-dialog-close"></div>
      </div>

      <div class="app-modal-body">
        <div class="settings-tabbed-pane">
          <div class="settings-tabbed-panels settings-tabbed-panels-top">
            <div class="settings-tabbed-panel settings-tabbed-panel-checked">
              <span class="settings-tabbed-panel-caption">Macros In</span>
            </div>
            <div class="settings-tabbed-panel">
              <span class="settings-tabbed-panel-caption">Record Macro</span>
            </div>
          </div>

          <div class="settings-tabbed-content settings-tabbed-content-top" style="padding: 0;">
            <!-- Macros In Tab -->
            <div class="settings-tabbed-content-block" style="display: block; padding: 12px;">
              <div class="form-group">
                <label class="form-label">Macros available in:</label>
                <div class="form-combobox" style="width: 100%; margin-bottom: 12px;">
                  <input type="text" id="macro-storage" readonly value="This Document Only" />
                  <a class="combobox-arrow"></a>
                </div>
              </div>
              
              <div class="macro-list-container">
                <div class="macro-list" id="macro-list">
                  <!-- Macro items will be added here -->
                  <div class="macro-item macro-item-disabled">
                    <div class="macro-name">No macros available</div>
                    <div class="macro-description">Record a macro to get started</div>
                  </div>
                </div>
              </div>
              
              <div class="macro-buttons" style="margin-top: 12px; display: flex; gap: 8px;">
                <input type="button" class="form-button" value="Run" id="macro-run" />
                <input type="button" class="form-button" value="Edit" id="macro-edit" />
                <input type="button" class="form-button" value="Delete" id="macro-delete" />
              </div>
            </div>

            <!-- Record Macro Tab -->
            <div class="settings-tabbed-content-block" style="display: none; padding: 12px;">
              <div class="form-group">
                <label class="form-label">Macro name:</label>
                <input type="text" class="form-text" id="macro-name" placeholder="Enter macro name" style="width: 100%;" />
              </div>
              
              <div class="form-group">
                <label class="form-label">Store macro in:</label>
                <div class="form-combobox" style="width: 100%;">
                  <input type="text" id="macro-save-location" readonly value="This Document Only" />
                  <a class="combobox-arrow"></a>
                </div>
              </div>
              
              <div class="form-group">
                <label class="form-label">Description:</label>
                <textarea class="form-textarea" id="macro-description" placeholder="Optional description" style="width: 100%; min-height: 60px;"></textarea>
              </div>
              
              <div class="form-group">
                <label class="form-label">Shortcut key:</label>
                <input type="text" class="form-text" id="macro-shortcut" placeholder="Ctrl+Shift+M" style="width: 100%;" />
              </div>
              
              <div class="macro-record-controls" style="margin-top: 16px; display: flex; gap: 8px;">
                <input type="button" class="form-button form-button-primary" value="Record" id="macro-record-start" />
                <input type="button" class="form-button" value="Stop Recording" id="macro-record-stop" disabled />
                <input type="button" class="form-button" value="Pause Recording" id="macro-record-pause" disabled />
              </div>
              
              <div class="macro-recording-indicator" id="macro-recording-indicator" style="display: none; margin-top: 12px; padding: 8px; background: #fff3cd; border: 1px solid #ffc107; border-radius: 4px;">
                <strong>Recording...</strong> All actions will be recorded.
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="app-modal-footer">
        <input type="button" class="form-button" value="Organize..." id="macro-organize" />
        <span style="flex: 1;"></span>
        <input type="button" class="form-button" value="Cancel" id="macro-dialog-cancel" />
        <input type="button" class="form-button form-button-primary" value="OK" id="macro-dialog-ok" />
      </div>
    </div>
  </div>
</body>
</html>
