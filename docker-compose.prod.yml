# World-Office Production Deployment
# ==================================
# Uses pre-built Docker images from container registry.
# Designed for single-command deployment: docker compose pull && docker compose up -d

version: "3.8"

services:
  # ── Core Microservices ───────────────────────────────────────────────

  identity-service:
    image: codeberg.org/world-office/identity-service:${IMAGE_TAG:-latest}
    container_name: world-office-identity
    restart: unless-stopped
    ports:
      - "${IDENTITY_PORT:-8001}:8001"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-worldoffice}:${POSTGRES_PASSWORD:-worldoffice_prod}@postgres:5432/${POSTGRES_DB:-world_office}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  storage-service:
    image: codeberg.org/world-office/storage-service:${IMAGE_TAG:-latest}
    container_name: world-office-storage
    restart: unless-stopped
    ports:
      - "${STORAGE_PORT:-8002}:8002"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-worldoffice}:${POSTGRES_PASSWORD:-worldoffice_prod}@postgres:5432/${POSTGRES_DB:-world_office}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  conversion-service:
    image: codeberg.org/world-office/conversion-service:${IMAGE_TAG:-latest}
    container_name: world-office-conversion
    restart: unless-stopped
    ports:
      - "${CONVERSION_PORT:-8003}:8003"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-worldoffice}:${POSTGRES_PASSWORD:-worldoffice_prod}@postgres:5432/${POSTGRES_DB:-world_office}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  coauthoring-service:
    image: codeberg.org/world-office/coauthoring-service:${IMAGE_TAG:-latest}
    container_name: world-office-coauthoring
    restart: unless-stopped
    ports:
      - "${COAUTHORING_PORT:-8004}:8004"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-worldoffice}:${POSTGRES_PASSWORD:-worldoffice_prod}@postgres:5432/${POSTGRES_DB:-world_office}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  session-service:
    image: codeberg.org/world-office/session-service:${IMAGE_TAG:-latest}
    container_name: world-office-session
    restart: unless-stopped
    ports:
      - "${SESSION_PORT:-8005}:8005"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-worldoffice}:${POSTGRES_PASSWORD:-worldoffice_prod}@postgres:5432/${POSTGRES_DB:-world_office}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── API Gateway ──────────────────────────────────────────────────────

  api-gateway:
    image: codeberg.org/world-office/api-gateway:${IMAGE_TAG:-latest}
    container_name: world-office-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      IDENTITY_SERVICE_URL: http://identity-service:8001
      STORAGE_SERVICE_URL: http://storage-service:8002
      CONVERSION_SERVICE_URL: http://conversion-service:8003
      COAUTHORING_SERVICE_URL: http://coauthoring-service:8004
      SESSION_SERVICE_URL: http://session-service:8005
    depends_on:
      identity-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      conversion-service:
        condition: service_healthy
      coauthoring-service:
        condition: service_healthy
      session-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── Document Server ──────────────────────────────────────────────────

  # ── OpenCloud (OCIS) ─────────────────────────────────────────────────
  opencloud:
    image: owncloud/ocis:latest
    container_name: world-office-opencloud
    restart: unless-stopped
    hostname: opencloud
    ports:
      - "${OCIS_PORT:-9200}:9200"
    environment:
      OCIS_DOMAIN: ${OCIS_DOMAIN:-localhost}
      OCIS_URL: ${OCIS_URL:-https://localhost:9200}
      OCIS_INSECURE: "true"
      PROXY_INSECURE_BACKENDS: "true"
      OCIS_JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      TOKEN_MANAGER_JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      OCIS_TRANSFER_SECRET: ${TRANSFER_SECRET:-transfer-secret}
      OCIS_MACHINE_AUTH_API_KEY: ${MACHINE_AUTH_KEY:-machine-key}
      IDM_CREATE_DEMO_USERS: "true"
      IDM_ADMIN_PASSWORD: ${OCIS_ADMIN_PASSWORD:-admin}
      NATS_NATS_HOST: "0.0.0.0"
      NATS_NATS_PORT: "9233"
      GATEWAY_GRPC_ADDR: "0.0.0.0:9142"
    volumes:
      - ocis_data:/var/lib/ocis
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:9200/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  collaboration:
    image: owncloud/ocis:latest
    container_name: world-office-collaboration
    restart: unless-stopped
    hostname: collaboration
    depends_on:
      opencloud:
        condition: service_healthy
    command: ["collaboration", "server"]
    environment:
      COLLABORATION_GRPC_ADDR: 0.0.0.0:9301
      COLLABORATION_HTTP_ADDR: 0.0.0.0:9300
      MICRO_REGISTRY: nats-js-kv
      MICRO_REGISTRY_ADDRESS: opencloud:9233
      GATEWAY_GRPC_ADDR: opencloud:9142
      COLLABORATION_WOPI_SRC: http://docserver:80
      COLLABORATION_APP_ADDR: ${PUBLIC_URL:-https://editor.cloud.graphwiz.ai}
      COLLABORATION_APP_INSECURE: "true"
      COLLABORATION_APP_NAME: WorldOffice
      COLLABORATION_APP_PRODUCT: WorldOffice
      COLLABORATION_WOPI_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      COLLABORATION_APP_PROOF_DISABLE: "true"
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "true"
      OCIS_URL: ${OCIS_URL:-https://opencloud:9200}
      OCIS_INSECURE: "true"
      OCIS_JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- http://localhost:9300/wopi/discovery || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  docserver:
    image: codeberg.org/world-office/docserver:${IMAGE_TAG:-latest}
    container_name: world-office-docserver
    restart: unless-stopped
    depends_on:
      collaboration:
        condition: service_healthy
    ports:
      - "${DOCSERVER_PORT:-80}:80"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      JWT_SECRET: ${DOCSERVER_JWT_SECRET:-${JWT_SECRET:-prod-docserver-secret}}
      WOPI_HOST_URL: ${WOPI_HOST_URL:-http://ocis:9200}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── Node.js Server ──────────────────────────────────────────────────

  server:
    image: codeberg.org/world-office/server:${IMAGE_TAG:-latest}
    container_name: world-office-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-prod-secret-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-worldoffice}:${POSTGRES_PASSWORD:-worldoffice_prod}@postgres:5432/${POSTGRES_DB:-world_office}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3