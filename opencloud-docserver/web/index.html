<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ name }} — opencloud-docserver</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Insert-image dialog styles (scoped here; style.css is maintained
       separately). The file input needs to be wider than the 84px used by
       the table dialog's number fields, and the preview/error rows are
       specific to this dialog. */
    #image-dialog .dialog-field input[type="file"] { width: auto; max-width: 220px; }
    .image-preview-wrap { margin: 10px 0; text-align: center; }
    .image-preview-wrap img {
      max-width: 220px;
      max-height: 160px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .image-error { min-height: 16px; margin-top: 8px; font-size: 12px; color: #f87171; }
  </style>
</head>
<body>
  <header id="toolbar" class="toolbar">
    <button data-cmd="bold" title="Bold (Ctrl+B)" data-i18n-title="Toolbar.BoldTitle">B</button>
    <button data-cmd="italic" title="Italic (Ctrl+I)" data-i18n-title="Toolbar.ItalicTitle"><i>I</i></button>
    <button data-cmd="underline" title="Underline (Ctrl+U)" data-i18n-title="Toolbar.UnderlineTitle"><u>U</u></button>
    <span class="sep"></span>
    <button data-cmd="formatBlock" data-value="H1" title="Heading 1" data-i18n-title="Toolbar.Heading1Title">H1</button>
    <button data-cmd="formatBlock" data-value="H2" title="Heading 2" data-i18n-title="Toolbar.Heading2Title">H2</button>
    <button data-cmd="formatBlock" data-value="P" title="Paragraph" data-i18n-title="Toolbar.ParagraphTitle">¶</button>
    <span class="sep"></span>
    <button data-cmd="insertUnorderedList" title="Bullet list" data-i18n-title="Toolbar.BulletListTitle">•≡</button>
    <button data-cmd="insertOrderedList" title="Numbered list" data-i18n-title="Toolbar.NumberedListTitle">1≡</button>
    <button id="btn-table" title="Insert table" data-i18n-title="Toolbar.InsertTableTitle">▦</button>
    <button id="btn-image" title="Insert image" data-i18n-title="Toolbar.InsertImageTitle">🖼</button>
    <span class="sep"></span>
    <button id="btn-undo" data-cmd="undo" title="Undo (Ctrl+Z)" data-i18n-title="Toolbar.UndoTitle">↶</button>
    <button id="btn-redo" data-cmd="redo" title="Redo (Ctrl+Y)" data-i18n-title="Toolbar.RedoTitle">↷</button>
    <span class="spacer"></span>
    <span id="status" class="status" data-i18n="Status.Ready">Ready</span>
    <button id="btn-save" class="primary" title="Save (Ctrl+S)" data-i18n="Toolbar.Save" data-i18n-title="Toolbar.SaveTitle">Save</button>
  </header>

  <main>
    <div id="editor" contenteditable="true" spellcheck="true"></div>
  </main>

  <!-- Insert-table dialog (modal): rows/cols picked here, then a real
       <table> is inserted at the saved cursor position. -->
  <div id="table-dialog" class="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="table-dialog-title">
    <div class="dialog">
      <h3 id="table-dialog-title" data-i18n="Toolbar.InsertTable">Insert table</h3>
      <div class="dialog-field">
        <label for="table-rows" data-i18n="Table.Rows">Rows</label>
        <input id="table-rows" type="number" min="1" max="20" value="2" inputmode="numeric">
      </div>
      <div class="dialog-field">
        <label for="table-cols" data-i18n="Table.Columns">Columns</label>
        <input id="table-cols" type="number" min="1" max="10" value="3" inputmode="numeric">
      </div>
      <div class="dialog-actions">
        <button id="btn-table-cancel">Cancel</button>
        <button id="btn-table-ok" class="primary">Insert</button>
      </div>
    </div>
  </div>

  <!-- Insert-image dialog (modal): a local image file is picked and
       previewed here, then embedded as a self-contained data-URI <img> at
       the saved cursor position. Nothing leaves the browser until the next
       save, when the server embeds data-URI images into the stored
       document (ODT: draw:frame/draw:image binaries). -->
  <div id="image-dialog" class="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="image-dialog-title">
    <div class="dialog">
      <h3 id="image-dialog-title" data-i18n="Toolbar.InsertImage">Insert image</h3>
      <div class="dialog-field">
        <label for="image-file" data-i18n="Image.ChooseFile">Image file</label>
        <input id="image-file" type="file"
               accept="image/png,image/jpeg,image/gif,image/bmp,image/webp,image/svg+xml">
      </div>
      <div id="image-preview-wrap" class="image-preview-wrap" hidden>
        <img id="image-preview" alt="">
      </div>
      <div id="image-error" class="image-error" role="alert"></div>
      <div class="dialog-actions">
        <button id="btn-image-cancel" data-i18n="Image.Cancel">Cancel</button>
        <button id="btn-image-ok" class="primary" disabled data-i18n="Image.Insert">Insert</button>
      </div>
    </div>
  </div>

  <script>
    window.__DOC_ID__ = {{ doc_id | tojson }};
    window.__DOC_NAME__ = {{ name | tojson }};
    window.__READ_ONLY__ = {{ read_only | tojson }};
    window.__SESSION__ = {{ session_id | tojson }};
  </script>
  <script src="/static/i18n.js"></script>
  <script src="/static/editor.js"></script>
</body>
</html>
