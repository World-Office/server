<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e28">
  <title>{{ name }} — opencloud-docserver</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Insert-image dialog styles (scoped here; style.css is maintained
       separately). The file input needs to be wider than the 84px used by
       the table dialog's number fields, and the preview/error rows are
       specific to this dialog. */
    #image-dialog .dialog-field input[type="file"] { width: auto; max-width: 220px; }
    .image-preview-wrap { margin: 10px 0; text-align: center; }
    .image-preview-wrap img {
      max-width: 220px;
      max-height: 160px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .image-error { min-height: 16px; margin-top: 8px; font-size: 12px; color: #f87171; }

    /* Find-and-replace dialog styles (scoped here; style.css is maintained
       separately). Wider dialog with a query row + step arrows, a
       match-case option, and the counter/status lines. */
    .find-dialog { width: 380px; }
    .find-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .find-head h3 { margin: 0; }
    .find-count {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .find-count.no-match { color: #f87171; }
    .find-field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .find-field-row .find-label {
      font-size: 13px;
      color: var(--muted);
      flex: 0 0 auto;
    }
    .find-field-row input { flex: 1; width: auto; }
    .find-arrow { width: 34px; min-width: 34px; padding: 0; }
    .find-options { margin: 4px 0 10px; }
    .find-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }
    .find-check input { width: auto; }
    .find-status {
      min-height: 16px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .find-status.no-match { color: #f87171; }
  </style>
</head>
<body>
  <header id="toolbar" class="toolbar">
    <!-- Format group: character styles, font size/family, text color, highlight -->
    <button data-cmd="bold" title="Bold (Ctrl+B)" data-i18n-title="Toolbar.BoldTitle" aria-label="Bold">B</button>
    <button data-cmd="italic" title="Italic (Ctrl+I)" data-i18n-title="Toolbar.ItalicTitle" aria-label="Italic"><i>I</i></button>
    <button data-cmd="underline" title="Underline (Ctrl+U)" data-i18n-title="Toolbar.UnderlineTitle" aria-label="Underline"><u>U</u></button>
    <button data-cmd="strikeThrough" title="Strikethrough" data-i18n-title="Toolbar.StrikethroughTitle" aria-label="Strikethrough"><s>S</s></button>
    <select id="font-size" class="toolbar-select" title="Font size" data-i18n-title="Toolbar.FontSizeTitle" aria-label="Font size">
      <option value="1">8</option>
      <option value="2">10</option>
      <option value="3" selected>12</option>
      <option value="4">14</option>
      <option value="5">18</option>
      <option value="6">24</option>
      <option value="7">36</option>
    </select>
    <select id="font-family" class="toolbar-select" title="Font family" data-i18n-title="Toolbar.FontFamilyTitle" aria-label="Font family">
      <option value="" selected>Default</option>
      <option value="Arial">Arial</option>
      <option value="Courier New">Courier New</option>
      <option value="Georgia">Georgia</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Verdana">Verdana</option>
    </select>
    <label class="color-btn" title="Text color" data-i18n-title="Toolbar.TextColorTitle">
      <span class="color-key" aria-hidden="true">A</span>
      <input type="color" id="text-color" value="#333333" aria-label="Text color">
    </label>
    <label class="color-btn" title="Highlight color" data-i18n-title="Toolbar.HighlightTitle">
      <span class="color-key key-highlight" aria-hidden="true">A</span>
      <input type="color" id="highlight-color" value="#ffe97a" aria-label="Highlight color">
    </label>
    <span class="sep"></span>
    <!-- Paragraph styles: headings + paragraph reset -->
    <button data-cmd="formatBlock" data-value="H1" title="Heading 1" data-i18n-title="Toolbar.Heading1Title">H1</button>
    <button data-cmd="formatBlock" data-value="H2" title="Heading 2" data-i18n-title="Toolbar.Heading2Title">H2</button>
    <button data-cmd="formatBlock" data-value="H3" title="Heading 3" data-i18n-title="Toolbar.Heading3Title">H3</button>
    <button data-cmd="formatBlock" data-value="P" title="Paragraph" data-i18n-title="Toolbar.ParagraphTitle">¶</button>
    <span class="sep"></span>
    <!-- Alignment group -->
    <button data-cmd="justifyLeft" title="Align left (Ctrl+Shift+L)" data-i18n-title="Toolbar.AlignLeftTitle" aria-label="Align left"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1.5 3.5h10M1.5 7h13M1.5 10.5h10M1.5 14h13"/></svg></button>
    <button data-cmd="justifyCenter" title="Center (Ctrl+E)" data-i18n-title="Toolbar.AlignCenterTitle" aria-label="Center"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 3.5h11M1.5 7h13M2.5 10.5h11M1.5 14h13"/></svg></button>
    <button data-cmd="justifyRight" title="Align right (Ctrl+R)" data-i18n-title="Toolbar.AlignRightTitle" aria-label="Align right"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4.5 3.5h10M1.5 7h13M4.5 10.5h10M1.5 14h13"/></svg></button>
    <button data-cmd="justifyFull" title="Justify (Ctrl+J)" data-i18n-title="Toolbar.AlignJustifyTitle" aria-label="Justify"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M1.5 3.5h13M1.5 7h13M1.5 10.5h13M1.5 14h13"/></svg></button>
    <span class="sep"></span>
    <button data-cmd="insertUnorderedList" title="Bullet list" data-i18n-title="Toolbar.BulletListTitle">•≡</button>
    <button data-cmd="insertOrderedList" title="Numbered list" data-i18n-title="Toolbar.NumberedListTitle">1≡</button>
    <span class="sep"></span>
    <!-- Layout group: indent/outdent + line spacing -->
    <button data-cmd="indent" title="Increase indent" data-i18n-title="Toolbar.IndentTitle" aria-label="Increase indent"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 2.5v11M8.5 8H14.5M5 5.5 8 8l-3 2.5"/></svg></button>
    <button data-cmd="outdent" title="Decrease indent" data-i18n-title="Toolbar.OutdentTitle" aria-label="Decrease indent"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 2.5v11M1.5 8H8M11.5 5.5 8.5 8l3 2.5"/></svg></button>
    <select id="line-spacing" class="toolbar-select" title="Line spacing" data-i18n-title="Toolbar.LineSpacingTitle" aria-label="Line spacing">
      <option value="" selected>Spacing</option>
      <option value="1">1.0</option>
      <option value="1.15">1.15</option>
      <option value="1.5">1.5</option>
      <option value="2">2.0</option>
      <option value="2.5">2.5</option>
      <option value="3">3.0</option>
    </select>
    <span class="sep"></span>
    <button id="btn-table" title="Insert table" data-i18n-title="Toolbar.InsertTableTitle">▦</button>
    <button id="btn-image" title="Insert image" data-i18n-title="Toolbar.InsertImageTitle">🖼</button>
    <button id="btn-find" title="Find and replace (Ctrl+F)" data-i18n-title="Toolbar.FindTitle">🔍</button>
    <span class="sep"></span>
    <button id="btn-undo" data-cmd="undo" title="Undo (Ctrl+Z)" data-i18n-title="Toolbar.UndoTitle">↶</button>
    <button id="btn-redo" data-cmd="redo" title="Redo (Ctrl+Y)" data-i18n-title="Toolbar.RedoTitle">↷</button>
    <span class="spacer"></span>
    <span id="status" class="status" data-i18n="Status.Ready">Ready</span>
    <button id="btn-save" class="primary" title="Save (Ctrl+S)" data-i18n="Toolbar.Save" data-i18n-title="Toolbar.SaveTitle">Save</button>
  </header>

  <main>
    <div id="editor" contenteditable="true" spellcheck="true"></div>
  </main>

  <!-- Insert-table dialog (modal): rows/cols picked here, then a real
       <table> is inserted at the saved cursor position. -->
  <div id="table-dialog" class="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="table-dialog-title">
    <div class="dialog">
      <h3 id="table-dialog-title" data-i18n="Toolbar.InsertTable">Insert table</h3>
      <div class="dialog-field">
        <label for="table-rows" data-i18n="Table.Rows">Rows</label>
        <input id="table-rows" type="number" min="1" max="20" value="2" inputmode="numeric">
      </div>
      <div class="dialog-field">
        <label for="table-cols" data-i18n="Table.Columns">Columns</label>
        <input id="table-cols" type="number" min="1" max="10" value="3" inputmode="numeric">
      </div>
      <div class="dialog-actions">
        <button id="btn-table-cancel">Cancel</button>
        <button id="btn-table-ok" class="primary">Insert</button>
      </div>
    </div>
  </div>

  <!-- Insert-image dialog (modal): a local image file is picked and
       previewed here, then embedded as a self-contained data-URI <img> at
       the saved cursor position. Nothing leaves the browser until the next
       save, when the server embeds data-URI images into the stored
       document (ODT: draw:frame/draw:image binaries). -->
  <div id="image-dialog" class="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="image-dialog-title">
    <div class="dialog">
      <h3 id="image-dialog-title" data-i18n="Toolbar.InsertImage">Insert image</h3>
      <div class="dialog-field">
        <label for="image-file" data-i18n="Image.ChooseFile">Image file</label>
        <input id="image-file" type="file"
               accept="image/png,image/jpeg,image/gif,image/bmp,image/webp,image/svg+xml">
      </div>
      <div id="image-preview-wrap" class="image-preview-wrap" hidden>
        <img id="image-preview" alt="">
      </div>
      <div id="image-error" class="image-error" role="alert"></div>
      <div class="dialog-actions">
        <button id="btn-image-cancel" data-i18n="Image.Cancel">Cancel</button>
        <button id="btn-image-ok" class="primary" disabled data-i18n="Image.Insert">Insert</button>
      </div>
    </div>
  </div>

  <!-- Find-and-replace dialog: search the document, step through matches
       (highlighted with the native selection — the DOM is never mutated for
       highlighting) and replace single occurrences or all at once. Replace
       controls are disabled in read-only documents; finding stays
       available. Keyboard: Enter/Shift+Enter step next/previous, Ctrl+F
       re-opens, Escape closes. -->
  <div id="find-dialog" class="dialog-overlay" role="dialog" aria-modal="true" aria-labelledby="find-dialog-title">
    <div class="dialog find-dialog">
      <div class="find-head">
        <h3 id="find-dialog-title" data-i18n="Toolbar.Find">Find and replace</h3>
        <span id="find-count" class="find-count" role="status">0 / 0</span>
      </div>
      <div class="find-field-row">
        <label for="find-query" class="find-label" data-i18n="Find.SearchLabel">Find</label>
        <input id="find-query" type="text" spellcheck="false"
               placeholder="Search in document"
               data-i18n-placeholder="Find.SearchPlaceholder">
        <button id="btn-find-prev" class="find-arrow" title="Previous (Shift+Enter)" data-i18n-title="Find.Prev">▲</button>
        <button id="btn-find-next" class="find-arrow" title="Next (Enter)" data-i18n-title="Find.Next">▼</button>
      </div>
      <div class="find-field-row">
        <label for="find-replace" class="find-label" data-i18n="Find.ReplaceLabel">Replace with</label>
        <input id="find-replace" type="text" spellcheck="false">
      </div>
      <div class="find-options">
        <label class="find-check">
          <input id="find-match-case" type="checkbox">
          <span data-i18n="Find.MatchCase">Match case</span>
        </label>
      </div>
      <div id="find-status" class="find-status" role="status"></div>
      <div class="dialog-actions">
        <button id="btn-find-close" data-i18n="Find.Close">Close</button>
        <button id="btn-find-replace" data-i18n="Find.Replace">Replace</button>
        <button id="btn-find-replace-all" class="primary" data-i18n="Find.ReplaceAll">Replace all</button>
      </div>
    </div>
  </div>

  <script>
    window.__DOC_ID__ = {{ doc_id | tojson }};
    window.__DOC_NAME__ = {{ name | tojson }};
    window.__READ_ONLY__ = {{ read_only | tojson }};
    window.__SESSION__ = {{ session_id | tojson }};
  </script>
  <script src="/static/i18n.js"></script>
  <script src="/static/editor.js"></script>
</body>
</html>
