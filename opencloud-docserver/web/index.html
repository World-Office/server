<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ name }} — opencloud-docserver</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="toolbar">
    <button data-cmd="bold" title="Bold (Ctrl+B)">B</button>
    <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
    <span class="sep"></span>
    <button data-cmd="formatBlock" data-value="H1" title="Heading 1">H1</button>
    <button data-cmd="formatBlock" data-value="H2" title="Heading 2">H2</button>
    <button data-cmd="formatBlock" data-value="P" title="Paragraph">¶</button>
    <span class="sep"></span>
    <button data-cmd="insertUnorderedList" title="Bullet list">•≡</button>
    <button data-cmd="insertOrderedList" title="Numbered list">1≡</button>
    <button id="btn-table" title="Insert table">▦</button>
    <span class="sep"></span>
    <button data-cmd="undo" title="Undo (Ctrl+Z)">↶</button>
    <button data-cmd="redo" title="Redo (Ctrl+Y)">↷</button>
    <span class="spacer"></span>
    <span id="status" class="status">Ready</span>
    <button id="btn-save" class="primary" title="Save (Ctrl+S)">Save</button>
  </header>

  <main>
    <div id="editor" contenteditable="true" spellcheck="true"></div>
  </main>

  <script>
    window.__DOC_ID__ = {{ doc_id | tojson }};
    window.__DOC_NAME__ = {{ name | tojson }};
  </script>
  <script src="/static/editor.js"></script>
</body>
</html>
