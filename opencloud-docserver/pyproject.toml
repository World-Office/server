[project]
name = "opencloud-docserver"
version = "0.1.0"
description = "Stoic Linux document server for OpenCloud (OCIS) WOPI integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-docx>=1.1",
    "python-jose[cryptography]>=3.3",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "lxml>=5.0",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.uv]
package = false
