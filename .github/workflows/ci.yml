name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  JWT_SECRET: ci-test-secret

jobs:
  lint-rust:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Restore pdfium vendored cache
        uses: ./.github/actions/setup-pdfium-cache
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-lint
        timeout-minutes: 5

      - name: Check formatting
        run: cargo fmt --all -- --check
        timeout-minutes: 10

      - name: Check workspace
        run: cargo check --workspace
        timeout-minutes: 30

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 30

  test-rust-unit:
    name: Rust Unit Tests (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Restore pdfium vendored cache
        uses: ./.github/actions/setup-pdfium-cache
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-test
        timeout-minutes: 5

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked || true
        timeout-minutes: 10

      - name: Run unit tests (nextest, --lib)
        run: |
          mkdir -p test-results/nextest
          # --archive-file is a `nextest archive`/`nextest replay` flag, not a
          # `run` flag — passing it made nextest print a usage error and run
          # ZERO tests while the job stayed green. Removed 2026-09-14.
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON=1 cargo nextest run --workspace --lib \
            --message-format libtest-json-plus 2>&1 || true
        timeout-minutes: 60

      - name: Generate JUnit report (nextest)
        run: |
          cargo nextest report --workspace --lib \
            --junit test-results/nextest/junit.xml 2>&1 || true
        timeout-minutes: 5

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
        timeout-minutes: 5

      - name: Run doc tests
        run: cargo test --workspace --doc
        timeout-minutes: 30

  test-rust-integration:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    needs: [test-rust-unit]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Restore pdfium vendored cache
        uses: ./.github/actions/setup-pdfium-cache
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-integration
        timeout-minutes: 5

      - name: Run integration tests
        run: cargo test --workspace --tests
        timeout-minutes: 60

  coverage-rust:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Restore pdfium vendored cache
        uses: ./.github/actions/setup-pdfium-cache
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-coverage
        timeout-minutes: 5

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked || true
        timeout-minutes: 10

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lib \
            --lcov --output-path coverage/rust-lcov.info \
            --ignore-filename-regex '/target/|/tests/|/benches/|/examples/' \
            -- --test-threads=1
        timeout-minutes: 60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/rust-lcov.info
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30
        timeout-minutes: 5

  lint-ts:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # turbo builds wo-renderer-wasm (wasm-pack) as a dependency; the runner
      # image no longer ships wasm-pack preinstalled (same as typecheck-ts)
      - name: Install wasm-pack (throttle-proof)
        timeout-minutes: 15
        run: |
          if command -v wasm-pack >/dev/null 2>&1; then echo "wasm-pack present"; exit 0; fi
          for i in 1 2 3; do
            if curl -L -f -s --retry 3 --retry-delay 5 https://github.com/rustwasm/wasm-pack/releases/latest/download/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/wp.tgz \
               && tar -xzf /tmp/wp.tgz -C /tmp \
               && sudo mv /tmp/wasm-pack-v0.14.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/; then
              wasm-pack --version; exit 0
            fi
            echo "taiki-e/rustwasm download failed (attempt $i/3) — falling back to cargo install"
            cargo install wasm-pack --locked && exit 0
          done
          exit 1

      - run: pnpm lint
        timeout-minutes: 10

  typecheck-ts:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # wo-renderer-wasm's build script runs `wasm-pack build`; without the
      # toolchain on PATH turbo's dependency build dies with "wasm-pack: not
      # found" and typecheck never runs (same step as build-ts).
      - name: Install wasm-pack (throttle-proof)
        timeout-minutes: 15
        run: |
          if command -v wasm-pack >/dev/null 2>&1; then echo "wasm-pack present"; exit 0; fi
          for i in 1 2 3; do
            if curl -L -f -s --retry 3 --retry-delay 5 https://github.com/rustwasm/wasm-pack/releases/latest/download/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/wp.tgz \
               && tar -xzf /tmp/wp.tgz -C /tmp \
               && sudo mv /tmp/wasm-pack-v0.14.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/; then
              wasm-pack --version; exit 0
            fi
            echo "taiki-e/rustwasm download failed (attempt $i/3) — falling back to cargo install"
            cargo install wasm-pack --locked && exit 0
          done
          exit 1

      - run: pnpm typecheck
        timeout-minutes: 10

  build-ts:
    name: TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # The editors import @world-office/wo-renderer-wasm, whose pkg/ output is
      # generated by wasm-pack. Turbo builds it first via its build script, but
      # the toolchain must be present.
      - name: Install wasm-pack (throttle-proof)
        timeout-minutes: 15
        run: |
          if command -v wasm-pack >/dev/null 2>&1; then echo "wasm-pack present"; exit 0; fi
          for i in 1 2 3; do
            if curl -L -f -s --retry 3 --retry-delay 5 https://github.com/rustwasm/wasm-pack/releases/latest/download/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/wp.tgz \
               && tar -xzf /tmp/wp.tgz -C /tmp \
               && sudo mv /tmp/wasm-pack-v0.14.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/; then
              wasm-pack --version; exit 0
            fi
            echo "taiki-e/rustwasm download failed (attempt $i/3) — falling back to cargo install"
            cargo install wasm-pack --locked && exit 0
          done
          exit 1

      - run: pnpm exec turbo run build
        timeout-minutes: 15
        env:
          # parallel vite builds OOM the 7GB runner (heap OOM exit 134,
          # confirmed 308254019) — serialize bundlers, modest node heaps
          # (same recipe as parity-check.yml)
          TURBO_CONCURRENCY: "2"
          NODE_OPTIONS: --max-old-space-size=3072

  test-ts:
    name: TypeScript Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # Same toolchain requirement as build-ts/typecheck-ts: turbo builds
      # @world-office/wo-renderer-wasm (wasm-pack) before running tests.
      - name: Install wasm-pack (throttle-proof)
        timeout-minutes: 15
        run: |
          if command -v wasm-pack >/dev/null 2>&1; then echo "wasm-pack present"; exit 0; fi
          for i in 1 2 3; do
            if curl -L -f -s --retry 3 --retry-delay 5 https://github.com/rustwasm/wasm-pack/releases/latest/download/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/wp.tgz \
               && tar -xzf /tmp/wp.tgz -C /tmp \
               && sudo mv /tmp/wasm-pack-v0.14.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/; then
              wasm-pack --version; exit 0
            fi
            echo "taiki-e/rustwasm download failed (attempt $i/3) — falling back to cargo install"
            cargo install wasm-pack --locked && exit 0
          done
          exit 1

      - run: pnpm test
        timeout-minutes: 15

  build-rust:
    name: Rust Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Restore pdfium vendored cache
        uses: ./.github/actions/setup-pdfium-cache
        timeout-minutes: 2

      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-build
        timeout-minutes: 5

      - name: Check all targets
        run: cargo check --workspace --all-targets
        timeout-minutes: 30

