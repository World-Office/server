name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-rust:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test-rust-unit:
    name: Rust Unit Tests (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked || true
      - name: Run unit tests (nextest, --lib)
        run: |
          mkdir -p test-results/nextest
          cargo nextest run --workspace --lib --exclude wo-webdav \
            --message-format libtest-json-plus \
            --archive-file test-results/nextest/archive.tar.zst 2>&1 || true
      - name: Generate JUnit report (nextest)
        run: |
          cargo nextest report --workspace --lib --exclude wo-webdav \
            --junit test-results/nextest/junit.xml 2>&1 || true
        continue-on-error: true
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
        continue-on-error: true
      - name: Run doc tests
        run: cargo test --workspace --doc --exclude wo-webdav
        continue-on-error: true

  test-rust-integration:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    needs: [test-rust-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly
      - name: Run integration tests
        run: cargo test --workspace --tests --exclude wo-webdav
        continue-on-error: true

  coverage-rust:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked || true
      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace --lib --exclude wo-webdav \
            --lcov --output-path coverage/rust-lcov.info \
            --ignore-filename-regex '/target/|/tests/|/benches/|/examples/'
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/rust-lcov.info
          fail_ci_if_error: false
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30

  lint-ts:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck-ts:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build-ts:
    name: TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test-ts:
    name: TypeScript Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build-rust:
    name: Rust Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly
      - name: Check all targets
        run: cargo check --all-targets
