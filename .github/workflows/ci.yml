name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  JWT_SECRET: ci-test-secret

jobs:
  lint-rust:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-lint
        timeout-minutes: 5

      - name: Check formatting
        run: cargo fmt --all -- --check
        timeout-minutes: 10

      - name: Check workspace
        run: cargo check --workspace
        timeout-minutes: 30

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 30

  test-rust-unit:
    name: Rust Unit Tests (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-test
        timeout-minutes: 5

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked || true
        timeout-minutes: 10

      - name: Run unit tests (nextest, --lib)
        run: |
          mkdir -p test-results/nextest
          cargo nextest run --workspace --lib \
            --message-format libtest-json-plus \
            --archive-file test-results/nextest/archive.tar.zst 2>&1 || true
        timeout-minutes: 60

      - name: Generate JUnit report (nextest)
        run: |
          cargo nextest report --workspace --lib \
            --junit test-results/nextest/junit.xml 2>&1 || true
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
        timeout-minutes: 5
        continue-on-error: true

      - name: Run doc tests
        run: cargo test --workspace --doc
        timeout-minutes: 30
        continue-on-error: true

  test-rust-integration:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    needs: [test-rust-unit]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-integration
        timeout-minutes: 5

      - name: Run integration tests
        run: cargo test --workspace --tests
        timeout-minutes: 60
        continue-on-error: true

  coverage-rust:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-coverage
        timeout-minutes: 5

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked || true
        timeout-minutes: 10

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lib \
            --lcov --output-path coverage/rust-lcov.info \
            --ignore-filename-regex '/target/|/tests/|/benches/|/examples/' \
            -- --test-threads=1
        timeout-minutes: 60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/rust-lcov.info
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30
        timeout-minutes: 5

  lint-ts:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - run: pnpm lint
        timeout-minutes: 10

  typecheck-ts:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - run: pnpm typecheck
        timeout-minutes: 10

  build-ts:
    name: TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # The editors import @world-office/wo-renderer-wasm, whose pkg/ output is
      # generated by wasm-pack. Turbo builds it first via its build script, but
      # the toolchain must be present.
      - uses: taiki-e/install-action@wasm-pack
        timeout-minutes: 5

      - run: pnpm build --filter='!@world-office/tauri-poc'
        timeout-minutes: 15

  test-ts:
    name: TypeScript Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - run: pnpm test
        timeout-minutes: 15

  build-rust:
    name: Rust Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-build
        timeout-minutes: 5

      - name: Check all targets
        run: cargo check --workspace --all-targets
        timeout-minutes: 30

  docserver-tests:
    name: Docserver Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencloud-docserver
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        timeout-minutes: 5

      - name: Lint (ruff)
        run: uv run ruff check src tests
        timeout-minutes: 5

      - name: Test suite
        run: uv run pytest tests/ -q --tb=short -p no:randomly --ignore=tests/e2e
        timeout-minutes: 20

  # Eval gate (spec: agent-eval-harness): a change touching the agent tool
  # surface or the collaboration path must keep the mutation score at 100%
  # before it can merge. A surviving mutant = a guardrail without teeth.
  docserver-mutation-gate:
    name: Docserver Mutation Gate (score = 100%)
    runs-on: ubuntu-latest
    needs: docserver-tests
    defaults:
      run:
        working-directory: opencloud-docserver
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        timeout-minutes: 5

      - name: Mutation testing (exit 1 on any survivor)
        run: uv run python scripts/mutation-test.py
        timeout-minutes: 60
