name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  JWT_SECRET: ci-test-secret

jobs:
  lint-rust:
    name: Rust Lint
    runs-on: [self-hosted, ci-host]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
        timeout-minutes: 10

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-lint
        timeout-minutes: 5

      - name: Check formatting
        run: cargo fmt --all -- --check
        timeout-minutes: 10

      - name: Check workspace
        run: cargo check --workspace
        timeout-minutes: 30

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 30

  test-rust-unit:
    name: Rust Unit Tests (nightly)
    runs-on: [self-hosted, ci-host]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-test
        timeout-minutes: 5

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked || true
        timeout-minutes: 10

      - name: Run unit tests (nextest, --lib)
        run: |
          mkdir -p test-results/nextest
          cargo nextest run --workspace --lib \
            --message-format libtest-json-plus \
            --archive-file test-results/nextest/archive.tar.zst 2>&1 || true
        timeout-minutes: 60

      - name: Generate JUnit report (nextest)
        run: |
          cargo nextest report --workspace --lib \
            --junit test-results/nextest/junit.xml 2>&1 || true
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
        timeout-minutes: 5
        continue-on-error: true

      - name: Run doc tests
        run: cargo test --workspace --doc
        timeout-minutes: 30
        continue-on-error: true

  test-rust-integration:
    name: Rust Integration Tests
    runs-on: [self-hosted, ci-host]
    needs: [test-rust-unit]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-integration
        timeout-minutes: 5

      - name: Run integration tests
        run: cargo test --workspace --tests
        timeout-minutes: 60
        continue-on-error: true

  coverage-rust:
    name: Rust Coverage
    runs-on: [self-hosted, ci-host]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
        timeout-minutes: 10

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-coverage
        timeout-minutes: 5

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked || true
        timeout-minutes: 10

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --lib \
            --lcov --output-path coverage/rust-lcov.info \
            --ignore-filename-regex '/target/|/tests/|/benches/|/examples/' \
            -- --test-threads=1
        timeout-minutes: 60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/rust-lcov.info
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30
        timeout-minutes: 5

  lint-ts:
    name: TypeScript Lint
    runs-on: [self-hosted, ci-host]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - run: pnpm lint
        timeout-minutes: 10

  typecheck-ts:
    name: TypeScript Typecheck
    runs-on: [self-hosted, ci-host]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - run: pnpm typecheck
        timeout-minutes: 10

  build-ts:
    name: TypeScript Build
    runs-on: [self-hosted, ci-host]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - run: pnpm build --filter='!@world-office/tauri-poc'
        timeout-minutes: 15

  test-ts:
    name: TypeScript Test
    runs-on: [self-hosted, ci-host]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - run: pnpm test
        timeout-minutes: 15

  build-rust:
    name: Rust Build Check
    runs-on: [self-hosted, ci-host]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-build
        timeout-minutes: 5

      - name: Check all targets
        run: cargo check --workspace --all-targets
        timeout-minutes: 30
