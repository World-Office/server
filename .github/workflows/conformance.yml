name: OOXML Conformance

on:
  schedule:
    # Weekly: re-capture truth from LibreOffice, compare against renderer
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      threshold:
        description: "Regression threshold (fidelity drop allowed)"
        required: false
        default: "0.05"
      recapture_truth:
        description: "Re-capture truth from LibreOffice (use on schedule)"
        required: false
        default: "false"
  pull_request:
    paths:
      - "core/crates/wo-conformance/**"
      - "core/crates/wo-docx-renderer/**"
      - "core/crates/wo-ooxml/**"
      - "core/crates/wo-renderer/**"
      - "core/crates/wo-common/**"
      - "scripts/harness-graph/**"

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Unit tests (wo-conformance + wo-docx-renderer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install poppler (pdftotext for the PDF projection adapter)
        run: pdftotext -v || sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Test wo-conformance (lib + integration)
        run: cargo test -p wo-conformance -- --test-threads=1

      - name: Test wo-docx-renderer
        run: cargo test -p wo-docx-renderer --lib -- --test-threads=1

  harness-graph:
    name: Harness graph drift gate (features.yaml ↔ graph.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --break-system-packages pyyaml

      - name: Drift gate
        working-directory: .
        run: python3 scripts/harness-graph/seed.py --check

  cross-engine-fidelity:
    name: Cross-engine fidelity (wo-docx-renderer vs LibreOffice)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui
          libreoffice --version

      - name: Install Python dependencies
        run: python3 -m pip install --break-system-packages pymupdf

      - name: Build wo-render-ir
        run: cargo build -p wo-docx-renderer --bin wo-render-ir

      - name: Generate corpus (if missing)
        run: |
          cd core/crates/wo-conformance
          if [ ! -d corpus/cases ] || [ -z "$(ls corpus/cases/*.docx 2>/dev/null)" ]; then
            python3 scripts/generate-corpus.py corpus/cases
          fi

      # Only re-capture truth on schedule or manual dispatch with recapture_truth=true.
      # On PRs, use the committed truth to compare against the engine.
      - name: Capture truth from LibreOffice
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.recapture_truth == 'true')
        run: |
          cd core/crates/wo-conformance
          python3 scripts/capture-truth.py capture corpus --force

      - name: Render corpus through wo-docx-renderer
        run: |
          cd core/crates/wo-conformance
          BIN="$(realpath ../../target/debug/wo-render-ir)"
          for docx in corpus/cases/*.docx; do
            stem="$(basename "$docx" .docx)"
            "$BIN" "$docx" "corpus/cases/${stem}.engine.json"
          done

      - name: Compare engines
        run: |
          cd core/crates/wo-conformance
          python3 scripts/capture-truth.py compare corpus

      - name: Check regression
        run: |
          cd core/crates/wo-conformance
          THRESHOLD="${{ github.event.inputs.threshold || '0.05' }}"
          python3 scripts/capture-truth.py regression corpus --threshold "$THRESHOLD"

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            core/crates/wo-conformance/corpus/comparison-*.json
            core/crates/wo-conformance/corpus/baseline.json
          retention-days: 90

  onlyoffice-oracle:
    # Nightly: record OnlyOffice behavior (the CI-runnable oracle) and diff it
    # against the committed reference truth. Heavy container — never on PRs.
    name: OnlyOffice oracle (pinned DS, corpus capture + cross-engine diff)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install poppler (pdftotext)
        run: pdftotext -v || sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Start pinned OnlyOffice Document Server
        run: |
          source core/crates/wo-conformance/scripts/onlyoffice-image.env
          docker run -d --name oo-oracle -p 9980:80 \
            -e JWT_ENABLED=true -e JWT_SECRET=devsecret \
            "${OO_DS_IMAGE}"
          for i in $(seq 1 60); do
            if [ "$(curl -s http://127.0.0.1:9980/healthcheck)" = "true" ]; then break; fi
            sleep 5
          done
          [ "$(curl -s http://127.0.0.1:9980/healthcheck)" = "true" ] || { docker logs oo-oracle | tail -50; exit 1; }

      - name: Live adapter test
        working-directory: .
        env:
          OO_DS_URL: http://127.0.0.1:9980
          OO_DS_JWT: devsecret
          OO_DS_PUBLIC_HOST: 172.17.0.1
        run: cargo test -p wo-conformance --test onlyoffice_live -- --ignored

      - name: Capture OnlyOffice goldens for the corpus
        working-directory: core/crates/wo-conformance
        env:
          OO_DS_URL: http://127.0.0.1:9980
          OO_DS_JWT: devsecret
          OO_DS_PUBLIC_HOST: 172.17.0.1
        run: bash scripts/capture-onlyoffice.sh corpus/cases

      - name: Cross-engine diff (OnlyOffice vs reference truth)
        working-directory: core/crates/wo-conformance
        run: bash scripts/capture-onlyoffice.sh corpus/cases --diff-only

      - name: Upload oracle report + goldens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlyoffice-oracle
          path: |
            core/crates/wo-conformance/corpus/cases/*.onlyoffice.json
            core/crates/wo-conformance/corpus/oracle-report-*.txt
          retention-days: 90
