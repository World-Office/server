name: build-docserver-image

# Rebuild the worldoffice/documentserver:latest image on the prod host
# (legion, self-hosted runner) and recreate the docserver container.
# Why: the running image predates 777693d6 — its baked assets/demo.docx is the
# corrupt embedded fallback, so /demo/document returned a broken zip and /word/
# showed "Failed to load document … Invalid checksum". Rebuilding at main bakes
# the valid assets/demo.docx (and the fixed embedded fallback).
#
# Dockerfile requirement: frontend-dist/ must exist in the build context — we
# reuse the UI already staged at /home/weiss/editor-ui-b2c1c282.

on:
  workflow_dispatch:

jobs:
  image:
    runs-on: [self-hosted, legion]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare frontend-dist build context
        run: |
          SRC=/home/weiss/editor-ui-b2c1c282
          [ -d "$SRC/word" ] || { echo "staged UI missing ($SRC) — run stage-ui first"; exit 1; }
          mkdir -p frontend-dist
          cp -a "$SRC/." frontend-dist/
          echo "frontend-dist: $(ls frontend-dist | tr '\n' ' ')"
      - name: Build docserver image
        run: |
          docker build -t worldoffice/documentserver:latest -f core/crates/wo-docserver/Dockerfile .
          docker images worldoffice/documentserver --format '{{.ID}} {{.CreatedSince}} {{.Size}}'
      - name: Recreate docserver container
        run: |
          docker compose -p opencloud-compose \
            --project-directory /home/weiss/opencloud-compose \
            -f /home/weiss/compose-cutover/docker-compose.yml up -d docserver
          sleep 6
          docker ps --format '{{.Names}} | {{.Status}} | {{.Image}}' | grep opencloud-compose-docserver
      - name: Verify /demo/document is a valid zip
        run: |
          curl -fsSL http://192.168.42.42:8082/demo/document -o /tmp/demo.docx
          python3 - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile("/tmp/demo.docx")
          bad = z.testzip()
          print("demo docx entries:", len(z.namelist()), "bad:", bad)
          sys.exit(1 if bad else 0)
          PY
      - name: Verify public /word/ still serves the new UI bundle
        run: |
          curl -fsSL https://editor.cloud.graphwiz.ai/word/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1
