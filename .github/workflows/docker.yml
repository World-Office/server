# .github/workflows/docker.yml
name: Docker Build

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# The wo-docserver image is built on legion by build-docserver-image.yml (it
# takes the editor UI from the live editor-ui mount; the React editors were
# removed 2026-11-27, ADR-F1).
# GITHUB_TOKEN needs packages:write to push images to ghcr.io/world-office/*
# (denied: installation not allowed to Create organization package)
permissions:
  contents: read
  packages: write

jobs:
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: identity-service
            dockerfile: services.Dockerfile
          - service: storage-service
            dockerfile: services.Dockerfile
          - service: conversion-service
            dockerfile: services.Dockerfile
          - service: coauthoring-service
            dockerfile: services.Dockerfile
          - service: session-service
            dockerfile: services.Dockerfile
          - service: api-gateway
            dockerfile: services.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
        timeout-minutes: 5

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 30
