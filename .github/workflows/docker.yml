# .github/workflows/docker.yml
name: Docker Build

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# GITHUB_TOKEN needs packages:write to push images to ghcr.io/world-office/*
# (denied: installation not allowed to Create organization package)
permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # wo-renderer-wasm's build script runs `wasm-pack build`; the runner
      # image no longer ships wasm-pack preinstalled, so turbo's dependency
      # build dies with "wasm-pack: not found" (same as ci.yml typecheck-ts)
      - name: Install wasm-pack (throttle-proof)
        timeout-minutes: 15
        run: |
          if command -v wasm-pack >/dev/null 2>&1; then echo "wasm-pack present"; exit 0; fi
          for i in 1 2 3; do
            if curl -L -f -s --retry 3 --retry-delay 5 https://github.com/rustwasm/wasm-pack/releases/latest/download/wasm-pack-v0.14.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/wp.tgz \
               && tar -xzf /tmp/wp.tgz -C /tmp \
               && sudo mv /tmp/wasm-pack-v0.14.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/; then
              wasm-pack --version; exit 0
            fi
            echo "taiki-e/rustwasm download failed (attempt $i/3) — falling back to cargo install"
            cargo install wasm-pack --locked && exit 0
          done
          exit 1

      - name: Run build
        run: pnpm build --filter='!@world-office/tauri-poc'
        timeout-minutes: 15

      - name: Restructure dist directories
        run: |
          mkdir -p frontend-dist
          mv apps/web/apps/documenteditor-react/dist frontend-dist/word
          mv apps/web/apps/spreadsheeteditor-react/dist frontend-dist/sheet
          mv apps/web/apps/presentationeditor-react/dist frontend-dist/slide
          mv apps/web/apps/pdfeditor-react/dist frontend-dist/pdf
          mv apps/web/apps/visioeditor-react/dist frontend-dist/diagram
        timeout-minutes: 5

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist/
          retention-days: 7
        timeout-minutes: 5

  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: identity-service
            dockerfile: services.Dockerfile
          - service: storage-service
            dockerfile: services.Dockerfile
          - service: conversion-service
            dockerfile: services.Dockerfile
          - service: coauthoring-service
            dockerfile: services.Dockerfile
          - service: session-service
            dockerfile: services.Dockerfile
          - service: api-gateway
            dockerfile: services.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
        timeout-minutes: 5

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 30

  build-docserver:
    name: Build wo-docserver
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist/
        timeout-minutes: 5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/wo-docserver
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
        timeout-minutes: 5

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/crates/wo-docserver/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=wo-docserver
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 30
