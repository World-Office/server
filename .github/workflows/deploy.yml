# =============================================================================
# Deploy — Build Docker images and deploy to production
#
# Builds all services as Docker images, pushes to GitHub Container Registry,
# then pulls and restarts on the production server via SSH.
#
# Required secrets:
#   DEPLOY_HOST          - Production server hostname/IP
#   DEPLOY_USER          - SSH username for production server
#   DEPLOY_SSH_KEY       - SSH private key for production server
#   DEPLOY_COMPOSE_PATH  - Path to docker-compose files on server
#   GHCR_PAT             - GitHub Container Registry token (write:packages)
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # -------------------------------------------------------------------------
  # Build frontend — installs pnpm deps, builds all editors, collects
  # dist outputs into frontend-dist/ for the wo-docserver Docker build.
  # -------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend UI
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # Editors import @world-office/wo-renderer-wasm (pkg/ generated by
      # wasm-pack); turbo builds it first via its build script.
      - uses: taiki-e/install-action@wasm-pack
        timeout-minutes: 5

      - run: pnpm build --filter='!@world-office/tauri-poc'
        timeout-minutes: 20

      - run: node scripts/collect-frontend-dist.mjs
        timeout-minutes: 5

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/
          retention-days: 1
        timeout-minutes: 5

  # -------------------------------------------------------------------------
  # Build and push all Docker images to GitHub Container Registry
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - storage-service
          - conversion-service
          - coauthoring-service
          - session-service
          - api-gateway
        dockerfile:
          - services.Dockerfile
        include:
          - service: docserver
            dockerfile: core/crates/wo-docserver/Dockerfile
          - service: server
            dockerfile: services/server/Dockerfile
            context: services/server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Lowercase GHCR owner
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # NOTE: there is intentionally NO deploy job. Production is legion's
  # docker compose (opencloud-compose project, /home/weiss/opencloud-compose),
  # reachable only over the OpenVPN — GitHub runners can't SSH there, and the
  # /opt/worldoffice compose path this job once assumed never existed.
  # Real deployment = stage CI outputs on legion and flip the mounts:
  #   1. download the `frontend-dist` artifact from the latest green run
  #   2. tar word/sheet/slide/diagram/pdf -> ~/editor-ui-<sha>/ on legion
  #   3. point the docserver service's 5 editor-ui volume lines there
  #   4. docker compose -p opencloud-compose \
  #        --project-directory /home/weiss/opencloud-compose \
  #        -f ~/compose-cutover/docker-compose.yml up -d docserver
  #   5. sudo cp the file to /home/weiss/opencloud-compose/docker-compose.yml
  #   6. verify https://editor.cloud.graphwiz.ai/word/ serves the new bundle
  # The ghcr docserver image (built above) bakes binary + editor-ui for
  # fresh installs; existing installs use the mounts.
