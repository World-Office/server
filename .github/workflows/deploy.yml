# =============================================================================
# Deploy — Build Docker images and deploy to production
#
# Builds all services as Docker images, pushes to GitHub Container Registry,
# then pulls and restarts on the production server via SSH.
#
# Required secrets:
#   DEPLOY_HOST          - Production server hostname/IP
#   DEPLOY_USER          - SSH username for production server
#   DEPLOY_SSH_KEY       - SSH private key for production server
#   DEPLOY_COMPOSE_PATH  - Path to docker-compose files on server
#   GHCR_PAT             - GitHub Container Registry token (write:packages)
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # -------------------------------------------------------------------------
  # Build frontend — installs pnpm deps, builds all editors, collects
  # dist outputs into frontend-dist/ for the wo-docserver Docker build.
  # -------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend UI
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - uses: pnpm/action-setup@v4
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - run: pnpm build --filter='!@world-office/tauri-poc'
        timeout-minutes: 20

      - run: node scripts/collect-frontend-dist.mjs
        timeout-minutes: 5

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/
          retention-days: 1
        timeout-minutes: 5

  # -------------------------------------------------------------------------
  # Build and push all Docker images to GitHub Container Registry
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - storage-service
          - conversion-service
          - coauthoring-service
          - session-service
          - api-gateway
        dockerfile:
          - services.Dockerfile
        include:
          - service: docserver
            dockerfile: core/crates/wo-docserver/Dockerfile
          - service: server
            dockerfile: services/server/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Lowercase GHCR owner
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            COMPOSE_PATH="${{ secrets.DEPLOY_COMPOSE_PATH }}"
            if [ -z "$COMPOSE_PATH" ]; then
              COMPOSE_PATH="/opt/worldoffice"
            fi
            if [ ! -f "$COMPOSE_PATH/docker-compose.prod.yml" ]; then
              echo "ERROR: docker-compose.prod.yml not found at $COMPOSE_PATH"
              exit 1
            fi
            cd "$COMPOSE_PATH"
            echo "Pulling latest images..."
            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml pull
            echo "Starting services..."
            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml up -d
            echo "Deployed at $(date)"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            COMPOSE_PATH="${{ secrets.DEPLOY_COMPOSE_PATH }}"
            if [ -z "$COMPOSE_PATH" ]; then
              COMPOSE_PATH="/opt/worldoffice"
            fi
            cd "$COMPOSE_PATH"
            echo "--- Service status ---"
            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml ps
            echo "--- Health checks ---"
            for svc in identity-service storage-service conversion-service coauthoring-service session-service api-gateway docserver server; do
              echo -n "$svc: "
              port=$(grep -A1 "$svc:" docker-compose.prod.yml | grep -oP '\$\{[A-Z_]+:-\K[0-9]+' || echo "unknown")
              echo "checking..."
            done
