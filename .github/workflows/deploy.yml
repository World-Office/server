name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push identity-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=identity-service
          push: true
          tags: ghcr.io/${{ github.repository }}/identity-service:latest,ghcr.io/${{ github.repository }}/identity-service:${{ github.sha }}

      - name: Build and push storage-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=storage-service
          push: true
          tags: ghcr.io/${{ github.repository }}/storage-service:latest,ghcr.io/${{ github.repository }}/storage-service:${{ github.sha }}

      - name: Build and push conversion-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=conversion-service
          push: true
          tags: ghcr.io/${{ github.repository }}/conversion-service:latest,ghcr.io/${{ github.repository }}/conversion-service:${{ github.sha }}

      - name: Build and push coauthoring-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=coauthoring-service
          push: true
          tags: ghcr.io/${{ github.repository }}/coauthoring-service:latest,ghcr.io/${{ github.repository }}/coauthoring-service:${{ github.sha }}

      - name: Build and push session-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=session-service
          push: true
          tags: ghcr.io/${{ github.repository }}/session-service:latest,ghcr.io/${{ github.repository }}/session-service:${{ github.sha }}

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=api-gateway
          push: true
          tags: ghcr.io/${{ github.repository }}/api-gateway:latest,ghcr.io/${{ github.repository }}/api-gateway:${{ github.sha }}

      - name: Build and push docserver
        uses: docker/build-push-action@v5
        with:
          context: .
          file: core/crates/wo-docserver/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/docserver:latest,ghcr.io/${{ github.repository }}/docserver:${{ github.sha }}

      - name: Build and push server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/server:latest,ghcr.io/${{ github.repository }}/server:${{ github.sha }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            COMPOSE_PATH="${{ secrets.DEPLOY_COMPOSE_PATH }}"
            if [ -z "$COMPOSE_PATH" ]; then
              COMPOSE_PATH="/opt/worldoffice"
            fi
            if [ ! -f "$COMPOSE_PATH/docker-compose.prod.yml" ]; then
              echo "ERROR: docker-compose.prod.yml not found at $COMPOSE_PATH"
              exit 1
            fi
            cd "$COMPOSE_PATH"

            echo "Pulling latest images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            echo "Starting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            echo "Deployed $(date)"
        timeout-minutes: 15

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            COMPOSE_PATH="${{ secrets.DEPLOY_COMPOSE_PATH }}"
            if [ -z "$COMPOSE_PATH" ]; then
              COMPOSE_PATH="/opt/worldoffice"
            fi
            cd "$COMPOSE_PATH"
            echo "--- Service status ---"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            echo "--- Health check results ---"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=5 --no-color | grep -E "(health|Health|HEALTH)" || echo "No health logs found"
        timeout-minutes: 5
