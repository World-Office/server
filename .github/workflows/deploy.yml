name: Deploy Demo

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  JWT_SECRET: ci-test-secret

jobs:
  build-and-deploy:
    name: Build and Deploy to cloud.graphwiz.ai
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl libxml2
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev libxml2-dev
          else
            echo "No known package manager found"
            exit 1
          fi

      - name: Build wo-docserver (release)
        run: cargo build --release -p wo-docserver

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build editor frontends
        run: |
          pnpm --filter @world-office/documenteditor build
          pnpm --filter @world-office/spreadsheeteditor build
          pnpm --filter @world-office/presentationeditor build
          pnpm --filter @world-office/pdfeditor build
          pnpm --filter @world-office/visioeditor build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Copy binary to server
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" \
            target/release/wo-docserver \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/wo-docserver-new

      - name: Copy editor frontends to server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p /home/weiss/frontends/word /home/weiss/frontends/sheet /home/weiss/frontends/slide /home/weiss/frontends/pdf /home/weiss/frontends/diagram"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" \
            apps/web/apps/documenteditor-react/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/weiss/frontends/word/
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" \
            apps/web/apps/spreadsheeteditor-react/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/weiss/frontends/sheet/
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" \
            apps/web/apps/presentationeditor-react/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/weiss/frontends/slide/
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" \
            apps/web/apps/pdfeditor-react/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/weiss/frontends/pdf/
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" \
            apps/web/apps/visioeditor-react/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/weiss/frontends/diagram/

      - name: Deploy and restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            sudo mv /home/weiss/wo-docserver-new /opt/worldoffice/wo-docserver
            sudo rm -rf /opt/worldoffice/editor-ui
            sudo mkdir -p /opt/worldoffice/editor-ui
            sudo mv /home/weiss/frontends/word /opt/worldoffice/editor-ui/word
            sudo mv /home/weiss/frontends/sheet /opt/worldoffice/editor-ui/sheet
            sudo mv /home/weiss/frontends/slide /opt/worldoffice/editor-ui/slide
            sudo mv /home/weiss/frontends/pdf /opt/worldoffice/editor-ui/pdf
            sudo mv /home/weiss/frontends/diagram /opt/worldoffice/editor-ui/diagram
            sudo rm -rf /home/weiss/frontends
            sudo systemctl restart worldoffice.service

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "--- Binary ---"
            ls -la /opt/worldoffice/wo-docserver
            echo "--- Health ---"
            curl -sf http://localhost:9201/health && echo " OK" || echo " FAIL"
            echo "--- Service ---"
            sudo systemctl status worldoffice.service --no-pager 2>&1 | head -5
