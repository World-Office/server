# =============================================================================
# Deploy — Build Docker images and deploy to production
#
# Builds all services as Docker images, pushes to GitHub Container Registry,
# then pulls and restarts on the production server via SSH.
#
# Required secrets:
#   DEPLOY_HOST          - Production server hostname/IP
#   DEPLOY_USER          - SSH username for production server
#   DEPLOY_SSH_KEY       - SSH private key for production server
#   DEPLOY_COMPOSE_PATH  - Path to docker-compose files on server
#   GHCR_PAT             - GitHub Container Registry token (write:packages)
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # -------------------------------------------------------------------------
  # Build and push all Docker images to GitHub Container Registry
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity-service
          - storage-service
          - conversion-service
          - coauthoring-service
          - session-service
          - api-gateway
        dockerfile:
          - services.Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase GHCR owner
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.GHCR_OWNER }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # NOTE: there is intentionally NO deploy job. Production is legion's
  # docker compose (opencloud-compose project, /home/weiss/opencloud-compose),
  # reachable only over the OpenVPN — GitHub runners can't SSH there, and the
  # /opt/worldoffice compose path this job once assumed never existed.
  # Editor UI: the React editors were removed 2026-11-27 (ADR-F1, Leptos port
  # pending), so this workflow no longer builds a frontend-dist and no longer
  # builds the docserver image (its Dockerfile COPYs frontend-dist/). The
  # docserver image is built on legion by build-docserver-image.yml, which
  # takes the UI from the live editor-ui mount; existing installs keep serving
  # the last staged bundle until a Leptos UI ships.
