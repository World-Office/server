name: stage-ui-probe

# Read-only probe #2: sudo capability, override file, docserver service block.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, legion]
    steps:
      - name: Probe
        run: |
          echo "== sudo =="; sudo -n true 2>&1 && echo "passwordless sudo OK" || echo "sudo needs password"
          echo "== override file =="
          cat /home/weiss/opencloud-compose/docker-compose.override.yml 2>&1 | head -30
          echo "== docserver service block =="
          awk '/^  docserver:/{f=1} f{print} f&&/^  [a-z]/&&!/^  docserver:/{exit}' /home/weiss/opencloud-compose/docker-compose.yml
          echo "== images =="
          docker images worldoffice/documentserver --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}} {{.Size}}' 2>&1 | head -3
          echo "== current editor-ui head =="
          ls /home/weiss/editor-ui-7a777d89/word 2>&1 | head -8
          echo "== home writable =="; touch /home/weiss/.runner-write-test 2>&1 && echo write-ok && rm /home/weiss/.runner-write-test
