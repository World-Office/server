name: stage-ui-probe

# Read-only probe #3: full override file + full base docserver block.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, legion]
    steps:
      - name: Probe
        run: |
          echo "===== FULL override ====="
          cat /home/weiss/opencloud-compose/docker-compose.override.yml
          echo "===== candidate docserver blocks (base) ====="
          awk '/^  docserver:/{f=1} f{print} f&&/^  [a-z]/&&!/^  docserver:/{exit}' /home/weiss/opencloud-compose/docker-compose.yml
          echo "===== compose project state ====="
          docker compose -p opencloud-compose --project-directory /home/weiss/opencloud-compose ps -q docserver 2>&1 | head -2
          echo "===== docserver container portmap ====="
          docker port opencloud-compose-docserver-1 2>&1 | head -5
