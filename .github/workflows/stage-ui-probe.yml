name: stage-ui-probe

# Read-only environment probe run on the self-hosted legion runner (prod host).
# Learn what the staging workflow can do before flipping any mounts.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, legion]
    steps:
      - name: Environment
        run: |
          echo "== user =="; whoami; id | tr ',' '\n' | grep -E 'docker|wheel'
          echo "== docker =="
          docker version --format 'server={{.Server.Version}}' 2>&1 | head -1
          docker compose version 2>&1 | head -1
          echo "== opencloud-compose dir =="
          ls -la /home/weiss/opencloud-compose 2>&1 | head -30
          echo "== compose-cutover dir =="
          ls -la /home/weiss/compose-cutover 2>&1 | head -30
          echo "== running docserver containers =="
          docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}' 2>&1 | grep -i docserver | head -8
          echo "== editor-ui dirs on host =="
          ls -d /home/weiss/editor-ui-* 2>&1 | head -10
      - name: Compose mounts
        run: |
          echo "== editor-ui / volumes in compose =="
          grep -n "editor-ui\|/word\|/sheet\|/slide\|/pdf\|/diagram\|image:" /home/weiss/opencloud-compose/docker-compose.yml 2>&1 | head -40
