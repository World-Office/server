name: Parity Check

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/apps/documenteditor-wysiwyg/**'
      - 'core/crates/wo-**'
      - '.github/workflows/parity-check.yml'
  workflow_dispatch:
    inputs:
      full_test:
        description: 'Run full parity test suite'
        required: false
        default: 'false'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Build core
        run: cargo build --workspace --exclude wo-pdf --exclude wo-webdav
      - uses: taiki-e/install-action@wasm-pack
      - name: Build frontend
        run: |-
          pnpm install --frozen-lockfile
          pnpm build --filter='!@world-office/tauri-poc'

  test-core:
    name: Core Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      - name: Run tests
        run: cargo test --workspace --lib --exclude wo-pdf --exclude wo-webdav -- --test-threads=1

  ledger-build:
    name: Ledger Build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
      - uses: actions/checkout@v4
        with:
          repository: World-Office/wo-test-harness
          path: wo-test-harness
          ref: main
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ledger
        run: |
          cd wo-test-harness/census/ledger
          /usr/bin/python3 build.py
      - name: Upload ledger report
        uses: actions/upload-artifact@v4
        with:
          name: ledger-report
          path: wo-test-harness/census/ledger/ledger.json

  editor-gates:
    name: Editor Gate Suite
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run editor *.test.mjs gates
        run: |
          cd apps/web/apps/documenteditor-wysiwyg
          fails=0
          for f in *.test.mjs; do
            # shift-enter-behavior.test.mjs is jest+CommonJS on purpose (see
            # its header: Node 22's jest cannot require ESM) and drives a live
            # editor via WO_EDITOR_URL — it belongs to the live-stack runs.
            if [ "$f" = "shift-enter-behavior.test.mjs" ]; then
              echo "SKIP $f (jest/live-stack)"
              continue
            fi
            echo "-- $f"
            node "$f" || fails=$((fails+1))
          done
          echo "editor gates: $(( $(ls *.test.mjs | wc -l ) - 1 - fails )) pass, $fails fail"
          exit $fails

  visual-diff:
    name: Visual Diff
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.full_test == 'true' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
      - uses: actions/checkout@v4
        with:
          repository: World-Office/wo-test-harness
          path: wo-test-harness
          ref: main
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd wo-test-harness
          # pinned: diff.js loads pixelmatch's v6 NAMED export
          # (v5 was directly callable); 6.0.0 is the only v6 on npm. pngjs 7
          # matches. capture.js's playwright dep is not exercised by this job.
          npm install pixelmatch@6.0.0 pngjs@7.0.0
      - name: Run visual diff self-test
        run: |
          cd wo-test-harness/census/visual
          node diff.js --self-test

  performance:
    name: Performance Benchmark
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: inputs.full_test == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
      - uses: actions/checkout@v4
        with:
          repository: World-Office/wo-test-harness
          path: wo-test-harness
          ref: main
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run benchmarks
        run: |
          cd wo-test-harness/census/performance
          node benchmark.js > results.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: wo-test-harness/census/performance/results.json

  report:
    name: Generate Parity Report
    needs: [ledger-build, editor-gates, visual-diff, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: server
      - uses: actions/checkout@v4
        with:
          repository: World-Office/wo-test-harness
          path: wo-test-harness
          ref: main
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Generate report
        run: |
          cd wo-test-harness
          {
            echo "# Parity Report"
            echo
            echo "Generated: $(date)"
            echo
            echo "## Summary"
            echo
            echo "| Category | Status | Details |"
            echo "|----------|--------|---------|"
            echo "| Build | ${{ needs.build.result }} | Core compilation |"
            echo "| Tests | ${{ needs.test-core.result }} | Unit tests |"
            echo "| Ledger | ${{ needs.ledger-build.result }} | Feature tracking |"
            echo "| Editor Gates | ${{ needs.editor-gates.result }} | documenteditor-wysiwyg *.test.mjs suite |"
            echo "| Visual | ${{ needs.visual-diff.result }} | Screenshot comparison |"
            echo "| Performance | ${{ needs.performance.result }} | Benchmark results |"
            echo
            echo "## Detailed Results"
            echo
            echo "### Ledger"
          } > census/PARITY-REPORT.md
          head -20 census/ledger/ledger.json >> census/PARITY-REPORT.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: wo-test-harness/census/PARITY-REPORT.md
