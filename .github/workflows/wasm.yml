# .github/workflows/wasm.yml
name: WASM Build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm-x2t:
    name: Build wo-x2t-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-x2t
        timeout-minutes: 5

      - name: Build wo-x2t-wasm
        run: cargo build --target wasm32-unknown-unknown -p wo-x2t-wasm
        timeout-minutes: 30

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || true
        timeout-minutes: 10

      - name: Test wo-x2t-wasm (wasm-pack --node)
        run: wasm-pack test --node -p wo-x2t-wasm
        timeout-minutes: 15
        continue-on-error: true

  build-wasm-renderer:
    name: Build wo-renderer-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
        timeout-minutes: 10

      - name: Install system dependencies
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxml2-dev libxmlsec1-dev
          elif command -v pacman &> /dev/null; then
            sudo pacman -S --noconfirm pkg-config openssl
          elif command -v apk &> /dev/null; then
            sudo apk add pkgconfig openssl-dev
          else
            echo "No known package manager found"
            exit 1
          fi
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-renderer
        timeout-minutes: 5

      - name: Build wo-renderer-wasm
        run: cargo build --target wasm32-unknown-unknown -p wo-renderer-wasm
        timeout-minutes: 30

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked || true
        timeout-minutes: 10

      - name: Build WASM JS bindings
        run: wasm-pack build --target web --out-dir pkg core/crates/wo-renderer-wasm
        timeout-minutes: 15

      - name: Upload wo-renderer-wasm pkg
        uses: actions/upload-artifact@v4
        with:
          name: wo-renderer-wasm-pkg-${{ github.sha }}
          path: core/crates/wo-renderer-wasm/pkg/
          retention-days: 7
