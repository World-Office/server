# .forgejo/workflows/docker.yml
name: Docker Build

on:
  push:
    branches: [main]

env:
  REGISTRY: codeberg.org
  IMAGE_NAME: ${{ forgejo.repository }}

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: codeberg-medium
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@v4
        with:
          version: 10
        timeout-minutes: 5

      - name: Setup Node.js
        uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Run build
        run: pnpm build --filter='!@world-office/tauri-poc'
        timeout-minutes: 15

      - name: Restructure dist directories
        run: |
          mkdir -p frontend-dist
          mv apps/web/apps/documenteditor-react/dist frontend-dist/word
          mv apps/web/apps/spreadsheeteditor-react/dist frontend-dist/sheet
          mv apps/web/apps/presentationeditor-react/dist frontend-dist/slide
          mv apps/web/apps/pdfeditor-react/dist frontend-dist/pdf
          mv apps/web/apps/visioeditor-react/dist frontend-dist/diagram
        timeout-minutes: 5

      - name: Upload frontend artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist/
          retention-days: 7
        timeout-minutes: 5

  build-services:
    name: Build ${{ matrix.service }}
    runs-on: codeberg-medium
    strategy:
      matrix:
        include:
          - service: identity-service
            dockerfile: services.Dockerfile
          - service: storage-service
            dockerfile: services.Dockerfile
          - service: conversion-service
            dockerfile: services.Dockerfile
          - service: coauthoring-service
            dockerfile: services.Dockerfile
          - service: session-service
            dockerfile: services.Dockerfile
          - service: api-gateway
            dockerfile: services.Dockerfile
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Login to Codeberg Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}
        timeout-minutes: 5

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
        timeout-minutes: 5

      - name: Build and push Docker image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 30

  build-docserver:
    name: Build wo-docserver
    runs-on: codeberg-medium
    needs: [build-frontend]
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Download frontend artifact
        uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist/
        timeout-minutes: 5

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
        timeout-minutes: 5

      - name: Login to Codeberg Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}
        timeout-minutes: 5

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/wo-docserver
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
        timeout-minutes: 5

      - name: Build and push Docker image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: core/crates/wo-docserver/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=wo-docserver
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 30
