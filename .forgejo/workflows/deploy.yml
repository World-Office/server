# .forgejo/workflows/deploy.yml
name: Deploy

# Required secrets:
#   DEPLOY_HOST       - Production server hostname/IP
#   DEPLOY_USER       - SSH username for production server
#   DEPLOY_SSH_KEY    - SSH private key for production server authentication
#   DEPLOY_COMPOSE_PATH - Path to docker-compose.yml on server (default: /opt/worldoffice)
#   REGISTRY_USERNAME - Container registry username
#   REGISTRY_PASSWORD - Container registry password

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Login to Codeberg Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: codeberg.org
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push identity-service
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=identity-service
          push: true
          tags: codeberg.org/world-office/identity-service:latest,codeberg.org/world-office/identity-service:${{ github.sha }}

      - name: Build and push storage-service
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=storage-service
          push: true
          tags: codeberg.org/world-office/storage-service:latest,codeberg.org/world-office/storage-service:${{ github.sha }}

      - name: Build and push conversion-service
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=conversion-service
          push: true
          tags: codeberg.org/world-office/conversion-service:latest,codeberg.org/world-office/conversion-service:${{ github.sha }}

      - name: Build and push coauthoring-service
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=coauthoring-service
          push: true
          tags: codeberg.org/world-office/coauthoring-service:latest,codeberg.org/world-office/coauthoring-service:${{ github.sha }}

      - name: Build and push session-service
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=session-service
          push: true
          tags: codeberg.org/world-office/session-service:latest,codeberg.org/world-office/session-service:${{ github.sha }}

      - name: Build and push api-gateway
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: services.Dockerfile
          build-args: SERVICE_NAME=api-gateway
          push: true
          tags: codeberg.org/world-office/api-gateway:latest,codeberg.org/world-office/api-gateway:${{ github.sha }}

      - name: Build and push docserver
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: core/crates/wo-docserver/Dockerfile
          push: true
          tags: codeberg.org/world-office/docserver:latest,codeberg.org/world-office/docserver:${{ github.sha }}

      - name: Build and push server
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: services/server/Dockerfile
          push: true
          tags: codeberg.org/world-office/server:latest,codeberg.org/world-office/server:${{ github.sha }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: https://github.com/appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            COMPOSE_PATH="${{ secrets.DEPLOY_COMPOSE_PATH }}"
            if [ -z "$COMPOSE_PATH" ]; then
              COMPOSE_PATH="/opt/worldoffice"
            fi
            if [ ! -f "$COMPOSE_PATH/docker-compose.prod.yml" ]; then
              echo "ERROR: docker-compose.prod.yml not found at $COMPOSE_PATH"
              exit 1
            fi
            cd "$COMPOSE_PATH"
            echo "Pulling latest images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            echo "Starting services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            echo "Deployed $(date)"
        timeout-minutes: 15

      - name: Verify deployment
        uses: https://github.com/appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            COMPOSE_PATH="${{ secrets.DEPLOY_COMPOSE_PATH }}"
            if [ -z "$COMPOSE_PATH" ]; then
              COMPOSE_PATH="/opt/worldoffice"
            fi
            cd "$COMPOSE_PATH"
            echo "--- Service status ---"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
            echo "--- Health check results ---"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=5 --no-color | grep -E "(health|Health|HEALTH)" || echo "No health logs found"
        timeout-minutes: 5
