# .forgejo/workflows/deploy.yml
name: Deploy

# Required secrets:
#   DEPLOY_HOST       - Production server hostname/IP
#   DEPLOY_USER       - SSH username for production server
#   DEPLOY_SSH_KEY    - SSH private key for production server authentication
#   DEPLOY_COMPOSE_PATH - Path to docker-compose.yml on server (default: /opt/worldoffice)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: codeberg-medium
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: https://github.com/appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            COMPOSE_PATH="${{ secrets.DEPLOY_COMPOSE_PATH }}"
            if [ -z "$COMPOSE_PATH" ]; then
              COMPOSE_PATH="/opt/worldoffice"
            fi
            if [ ! -f "$COMPOSE_PATH/docker-compose.yml" ]; then
              echo "ERROR: docker-compose.yml not found at $COMPOSE_PATH"
              exit 1
            fi
            cd "$COMPOSE_PATH"
            IMAGE_TAG="${{ forgejo.repository }}"
            sed -i "s|worldoffice/documentserver:latest|codeberg.org/$IMAGE_TAG/wo-docserver:latest|g" docker-compose.yml
            echo "Pulling latest wo-docserver image..."
            docker compose pull wo-docserver
            echo "Restarting wo-docserver..."
            docker compose up -d wo-docserver
            echo "Deployed $(date)"
        timeout-minutes: 10

      - name: Verify deployment
        uses: https://github.com/appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            COMPOSE_PATH="${{ secrets.DEPLOY_COMPOSE_PATH }}"
            if [ -z "$COMPOSE_PATH" ]; then
              COMPOSE_PATH="/opt/worldoffice"
            fi
            cd "$COMPOSE_PATH"
            echo "--- wo-docserver status ---"
            docker compose ps wo-docserver
            echo "--- recent logs (last 10 lines) ---"
            docker compose logs --tail=10 wo-docserver
        timeout-minutes: 3
