# .forgejo/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-rust:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          channel: nightly
          components: rustfmt, clippy
        timeout-minutes: 10

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - name: Cache Cargo registry and build
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-lint-
        timeout-minutes: 5

      - name: Check formatting
        run: cargo fmt --all -- --check
        timeout-minutes: 10

      - name: Check workspace
        run: cargo check --workspace 
        timeout-minutes: 30

      - name: Clippy
        run: cargo clippy --workspace --all-targets  -- -D warnings
        timeout-minutes: 30

  test-rust-unit:
    name: Rust Unit Tests (nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          channel: nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - name: Cache Cargo registry and build
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
          key: rust-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-test-
        timeout-minutes: 5

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked || true
        timeout-minutes: 10

      - name: Run unit tests (nextest, --lib)
        run: |
          mkdir -p test-results/nextest
          cargo nextest run --workspace --lib  \
            --message-format libtest-json-plus \
            --archive-file test-results/nextest/archive.tar.zst 2>&1 || true
        timeout-minutes: 60

      - name: Generate JUnit report (nextest)
        run: |
          cargo nextest report --workspace --lib  \
            --junit test-results/nextest/junit.xml 2>&1 || true
        timeout-minutes: 5
        continue-on-error: true

      - name: Upload test reports
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: rust-test-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
        timeout-minutes: 5
        continue-on-error: true

      - name: Run doc tests
        run: cargo test --workspace --doc 
        timeout-minutes: 30
        continue-on-error: true

  test-rust-integration:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    needs: [test-rust-unit]
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          channel: nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - name: Cache Cargo registry and build
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-integration-
        timeout-minutes: 5

      - name: Run integration tests
        run: cargo test --workspace --tests 
        timeout-minutes: 60
        continue-on-error: true

  coverage-rust:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          channel: nightly
          components: llvm-tools-preview
        timeout-minutes: 10

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - name: Cache Cargo registry and build
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-llvm-cov
          key: rust-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-coverage-
        timeout-minutes: 5

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked || true
        timeout-minutes: 10

      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace --lib  \
            --lcov --output-path coverage/rust-lcov.info \
            --ignore-filename-regex '/target/|/tests/|/benches/|/examples/'
        timeout-minutes: 60

      - name: Generate HTML coverage report
        run: |
          cargo llvm-cov --workspace --lib  \
            --html --output-dir coverage/rust-html \
            --ignore-filename-regex '/target/|/tests/|/benches/|/examples/'
        timeout-minutes: 60

      - name: Upload coverage artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: rust-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 30
        timeout-minutes: 5

  lint-ts:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@v4
        with:
          version: 10
        timeout-minutes: 5

      - name: Setup Node.js
        uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Run lint
        run: pnpm lint
        timeout-minutes: 10

  typecheck-ts:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@v4
        with:
          version: 10
        timeout-minutes: 5

      - name: Setup Node.js
        uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Run typecheck
        run: pnpm typecheck
        timeout-minutes: 10

  build-ts:
    name: TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@v4
        with:
          version: 10
        timeout-minutes: 5

      - name: Setup Node.js
        uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Run build
        run: pnpm build --filter='!@world-office/tauri-poc'
        timeout-minutes: 15

  test-ts:
    name: TypeScript Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@v4
        with:
          version: 10
        timeout-minutes: 5

      - name: Setup Node.js
        uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
        timeout-minutes: 5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Run tests with coverage
        run: pnpm test
        timeout-minutes: 15

      - name: Upload TS coverage artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: ts-coverage-${{ github.sha }}
          path: |
            packages/**/coverage/
            apps/**/coverage/
          if-no-files-found: ignore
          retention-days: 30
        timeout-minutes: 5

  build-rust:
    name: Rust Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4
        timeout-minutes: 5

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          channel: nightly
        timeout-minutes: 10

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev
        timeout-minutes: 5

      - name: Cache Cargo registry and build
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-build-
        timeout-minutes: 5

      - name: Check all targets
        run: cargo check --workspace --all-targets 
        timeout-minutes: 30

  e2e-trigger:
    name: Trigger E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-rust, test-rust-unit, test-rust-integration, coverage-rust, lint-ts, typecheck-ts, build-ts, test-ts, build-rust]
    if: github.event_name == 'pull_request'
    steps:
      - name: Dispatch E2E workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            "https://codeberg.org/api/v1/repos/${{ github.repository }}/actions/workflows/e2e.yml/dispatches" \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.head_ref }}"}'
        timeout-minutes: 5
